name: Flutter prep
description: Install deps, apply patches, and generate code. Shared by all CI jobs.

inputs:
  patch-local-auth:
    description: >-
      Apply the local_auth_windows MSVC coroutine deprecation patch.
      Only needed on Windows.
    required: false
    default: 'false'
  sqlcipher:
    description: >-
      Build SQLCipher from source and patch pubspec.yaml to use source: source.
      Required for F-Droid reproducible builds.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Build SQLCipher amalgamation from source
      if: ${{ inputs.sqlcipher == 'true' }}
      shell: bash
      run: |
        sudo apt-get update && sudo apt-get install -y --no-install-recommends tcl clang make
        git clone --depth=1 --branch v4.5.7 https://github.com/sqlcipher/sqlcipher.git /tmp/sqlcipher
        cd /tmp/sqlcipher
        ./configure --enable-tempstore=yes --with-crypto-lib=none
        make sqlite3.c
        dart run tool/patch_fdroid_sqlite.dart /tmp/sqlcipher

    - name: Re-run pub get after SQLCipher patch
      if: ${{ inputs.sqlcipher == 'true' }}
      shell: bash
      run: flutter pub get

    - name: Patch appflowy_editor (onFocusReceived + mobile slash)
      shell: bash
      run: dart run tool/patch_appflowy_editor.dart

    - name: Patch talker_flutter (ListTile ink splash)
      shell: bash
      run: dart run tool/patch_talker_flutter.dart

    - name: Patch mdns_dart (query socket leak)
      shell: bash
      run: dart run tool/patch_mdns_dart.dart

    - name: Patch local_auth_windows (MSVC coroutine deprecation)
      if: ${{ inputs.patch-local-auth == 'true' }}
      shell: bash
      run: dart run tool/patch_local_auth_windows.dart

    - name: Generate code (Drift/Riverpod/Freezed)
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs

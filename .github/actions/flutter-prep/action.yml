name: Flutter prep
description: Install deps, apply patches, and generate code. Shared by all CI jobs.

inputs:
  patch-local-auth:
    description: >-
      Apply the local_auth_windows MSVC coroutine deprecation patch.
      Only needed on Windows.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: flutter pub get

    - name: Patch appflowy_editor (onFocusReceived + mobile slash)
      shell: bash
      run: dart run tool/patch_appflowy_editor.dart

    - name: Patch talker_flutter (ListTile ink splash)
      shell: bash
      run: dart run tool/patch_talker_flutter.dart

    - name: Patch local_auth_windows (MSVC coroutine deprecation)
      if: ${{ inputs.patch-local-auth == 'true' }}
      shell: bash
      run: dart run tool/patch_local_auth_windows.dart

    - name: Generate code (Drift/Riverpod/Freezed)
      shell: bash
      run: dart run build_runner build --delete-conflicting-outputs

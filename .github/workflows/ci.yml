name: CI & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*' # Triggers the workflow when you push tags like 'v1.0.0'
  pull_request:
    branches: [main]

# Grant permission to create a release and upload assets
permissions:
  contents: write

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Patch appflowy_editor (TextInputClient.onFocusReceived)
        run: dart run tool/patch_appflowy_editor.dart
      - name: Generate code (Drift/Riverpod/Freezed)
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test --coverage

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Patch appflowy_editor (TextInputClient.onFocusReceived)
        run: dart run tool/patch_appflowy_editor.dart
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Extract App Version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts (Workflow Summary)
        uses: actions/upload-artifact@v4
        with:
          name: nook-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  build-windows:
    needs: analyze-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        shell: bash
        run: flutter pub get
      - name: Patch appflowy_editor (TextInputClient.onFocusReceived)
        shell: bash
        run: dart run tool/patch_appflowy_editor.dart
      - name: Patch local_auth_windows (MSVC coroutine deprecation)
        shell: bash
        run: dart run tool/patch_local_auth_windows.dart
      - name: Generate code
        shell: bash
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Extract App Version
        shell: bash
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release Windows
        shell: bash
        run: flutter build windows --release

      - name: Package Windows build
        shell: powershell
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/nook-windows-v$env:APP_VERSION.zip -Force

      - name: Upload Windows Artifact (Workflow Summary)
        uses: actions/upload-artifact@v4
        with:
          name: nook-windows
          path: build/nook-windows-v${{ env.APP_VERSION }}.zip
          if-no-files-found: error

  build-ios:
    needs: analyze-and-test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Patch appflowy_editor (TextInputClient.onFocusReceived)
        run: dart run tool/patch_appflowy_editor.dart
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Extract App Version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS build
        run: |
          cd build/ios/iphoneos
          zip -r ../nook-ios-v${{ env.APP_VERSION }}.zip Runner.app
          cd ../../..

      - name: Upload iOS Artifact (Workflow Summary)
        uses: actions/upload-artifact@v4
        with:
          name: nook-ios
          path: build/ios/nook-ios-v${{ env.APP_VERSION }}.zip
          if-no-files-found: error

  release:
    needs: [build-android, build-windows, build-ios]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: nook-apks
          path: release/apks

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-windows
          path: release/windows

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: nook-ios
          path: release/ios

      - name: Prepare release body from CHANGELOG
        shell: bash
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          awk -v ver="[$VERSION]" '
            /^## \[/ {
              if (index($0, "## " ver) == 1) { on = 1; print; next }
              if (on) exit
            }
            on
          ' CHANGELOG.md > release-body.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          allowUpdates: true
          update_release_body: true
          files: |
            release/apks/*.apk
            release/windows/*.zip
            release/ios/*.zip
          name: Release ${{ github.ref_name }}

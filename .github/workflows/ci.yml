name: CI & Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags:
      - 'v*' # Triggers the workflow when you push tags like 'v1.0.0'
  pull_request:
    branches: [main]

# Grant permission to create a release and upload assets
permissions:
  contents: write

# Auto-cancel superseded runs on the same branch/PR so CI never queues stale
# work behind newer commits.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - uses: ./.github/actions/flutter-prep
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        # `-x network` skips the real-mDNS integration test (needs multicast
        # on a LAN); UDX/libp2p sync is covered hermetically over loopback.
        run: flutter test --coverage -x network

  build-android:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    environment: ci
    container:
      image: registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie
      options: --user root
    timeout-minutes: 60
    env:
      HAS_KEYSTORE: ${{ secrets.NOOK_KEYSTORE_BASE64 != '' }}
      PUB_CACHE: ${{ github.workspace }}/.pub-cache
      FLUTTER_HOME: /opt/flutter
      ANDROID_HOME: /opt/android-sdk
      # Consumed by the patched sqlite3 build hook to pick the per-ABI
      # libcrypto.a when compiling SQLCipher from source.
      NOOK_OPENSSL_DIR: /opt/openssl-android
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            cmake libglu1-mesa libsecret-1-dev ninja-build tcl clang make \
            binutils git curl unzip xz-utils zip sudo

      - name: Install Android NDK 28.2.13676358
        run: |
          # F-Droid buildserver ships sdkmanager as a system Debian package
          yes | sdkmanager "ndk;28.2.13676358" "build-tools;36.0.0"

      - name: Install Flutter 3.44.8
        run: |
          git clone --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git $FLUTTER_HOME
          echo "$FLUTTER_HOME/bin" >> $GITHUB_PATH
          $FLUTTER_HOME/bin/flutter config --no-analytics
          $FLUTTER_HOME/bin/flutter precache --android

      - name: Prebuild (pub get + codegen + JNI patch)
        run: |
          export PATH="$FLUTTER_HOME/bin:$PATH"
          flutter pub get --enforce-lockfile
          dart run build_runner build --delete-conflicting-outputs
          sed -i 's/-Wl,-z,max-page-size=16384/-Wl,-z,max-page-size=16384,--build-id=none/' \
            $PUB_CACHE/hosted/pub.dev/jni-*/src/CMakeLists.txt

      - name: Build SQLCipher from source
        run: |
          git clone --depth 1 --branch v4.5.7 https://github.com/sqlcipher/sqlcipher.git /opt/sqlcipher
          cd /opt/sqlcipher && ./configure --enable-tempstore=yes --with-crypto-lib=none && make sqlite3.c

      - name: Build OpenSSL for Android (static libcrypto)
        run: |
          set -euo pipefail
          NDK=$ANDROID_HOME/ndk/28.2.13676358
          TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          OPENSSL_VERSION=3.4.1

          # OpenSSL 3.4's android targets resolve the NDK by finding *clang on
          # $PATH* inside $ANDROID_NDK_ROOT (Configurations/15-android.conf
          # android_ndk()); without this it dies with "no NDK ...-gcc on $PATH".
          export ANDROID_NDK_ROOT=$NDK
          export PATH="$TOOLCHAIN/bin:$PATH"

          test -f "$NDK/source.properties"
          test -x "$TOOLCHAIN/bin/aarch64-linux-android21-clang"

          curl -fSL https://github.com/openssl/openssl/releases/download/openssl-$OPENSSL_VERSION/openssl-$OPENSSL_VERSION.tar.gz \
            -o /tmp/openssl.tar.gz

          build_openssl() {
            local TARGET=$1 DEST=/opt/openssl-android/$1
            rm -rf /opt/openssl-$OPENSSL_VERSION
            tar xzf /tmp/openssl.tar.gz -C /opt
            cd /opt/openssl-$OPENSSL_VERSION
            ./Configure "$TARGET" -D__ANDROID_API__=21 no-shared no-tests no-ui-console
            make build_libs -j$(nproc)
            mkdir -p "$DEST/lib" "$DEST/include"
            cp libcrypto.a "$DEST/lib/"
            cp -r include/openssl "$DEST/include/"
            test -f "$DEST/lib/libcrypto.a"
            test -f "$DEST/include/openssl/rand.h"
            echo "Built $TARGET → $DEST/lib/libcrypto.a"
          }

          build_openssl android-arm64
          build_openssl android-arm
          build_openssl android-x86_64

          echo "=== OpenSSL static libs ==="
          find /opt/openssl-android -name libcrypto.a

      - name: Apply app patches
        run: |
          export PATH="$FLUTTER_HOME/bin:$PATH"
          dart run tool/patch_fdroid_sqlite.dart /opt/sqlcipher /opt/openssl-android
          dart run tool/patch_appflowy_editor.dart
          dart run tool/patch_talker_flutter.dart
          dart run tool/patch_mdns_dart.dart
          dart run tool/patch_sqlite3_android_log.dart

      - name: Configure release signing (from secrets)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.NOOK_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NOOK_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NOOK_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NOOK_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build reproducible APKs
        run: |
          export PATH="$FLUTTER_HOME/bin:$PATH"
          export SOURCE_DATE_EPOCH=0
          flutter build apk --release --split-per-abi --target-platform=android-arm --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --split-per-abi --target-platform=android-arm64 --obfuscate --split-debug-info=build/symbols
          flutter build apk --release --split-per-abi --target-platform=android-x64 --obfuscate --split-debug-info=build/symbols

      - name: Verify libsqlite3.so has no unresolved crypto symbols
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="build/app/outputs/flutter-apk/app-${abi}-release.apk"
            test -f "$apk" || { echo "Missing $apk"; exit 1; }
            unzip -o -q "$apk" "lib/$abi/libsqlite3.so" -d "$TMP"
            lib="$TMP/lib/$abi/libsqlite3.so"
            ndx=$(readelf -sW "$lib" | awk '$8 == "RAND_bytes" {print $7}' | head -1)
            echo "$abi: RAND_bytes Ndx=$ndx"
            if [ -z "$ndx" ] || [ "$ndx" = "UND" ]; then
              echo "RAND_bytes is unresolved in $lib — crypto is not linked!"
              exit 1
            fi
            undefs=$(readelf -sW "$lib" | awk '$7 == "UND" && $8 ~ /^(RAND_|EVP_|HMAC_|PKCS5_|AES_|SHA)/ {print $8}' || true)
            if [ -n "$undefs" ]; then
              echo "Warning: $abi has UND crypto symbols (may be benign):"
              echo "$undefs"
            fi
            echo "$abi: OK"
          done

      - name: Upload Dart symbol files
        uses: actions/upload-artifact@v4
        with:
          name: nook-symbols
          path: build/symbols
          if-no-files-found: warn

      - name: Upload APK Artifacts (Workflow Summary)
        uses: actions/upload-artifact@v4
        with:
          name: nook-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          if-no-files-found: error

  build-windows:
    needs: analyze-and-test
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - uses: ./.github/actions/flutter-prep
        with:
          patch-local-auth: 'true'

      - name: Extract App Version
        shell: bash
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | sed -E 's/\+[0-9]+$//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release Windows
        shell: bash
        run: flutter build windows --release

      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer (Inno Setup)
        shell: powershell
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          dart run tool/build_installer.dart --iscc $iscc

      - name: Verify installer was produced
        shell: powershell
        run: |
          $exe = Get-ChildItem build/installers/nook_setup_*.exe
          if (-not $exe) { throw "Installer .exe was not produced" }
          Write-Host "Installer: $($exe.FullName)"

      - name: Package Windows build
        shell: powershell
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/nook-windows-v$env:APP_VERSION.zip -Force

      - name: Upload Windows Artifact (Workflow Summary)
        uses: actions/upload-artifact@v4
        with:
          name: nook-windows
          path: |
            build/nook-windows-v${{ env.APP_VERSION }}.zip
            build/installers/nook_setup_*.exe
          if-no-files-found: error

  build-ios:
    needs: analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - uses: ./.github/actions/flutter-prep

      - name: Extract App Version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | sed -E 's/\+[0-9]+$//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package iOS build
        run: |
          cd build/ios/iphoneos
          zip -r ../nook-ios-v${{ env.APP_VERSION }}.zip Runner.app
          cd ../../..

      - name: Upload iOS Artifact (Workflow Summary)
        uses: actions/upload-artifact@v4
        with:
          name: nook-ios
          path: build/ios/nook-ios-v${{ env.APP_VERSION }}.zip
          if-no-files-found: error

  build-macos:
    needs: analyze-and-test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - uses: ./.github/actions/flutter-prep

      - name: Extract App Version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | sed -E 's/\+[0-9]+$//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release macOS (unsigned)
        run: flutter build macos --release

      - name: Build macOS arm64 for universal
        run: flutter build macos --release --target-platform=macos-arm64

      - name: Build macOS x64 for universal
        run: flutter build macos --release --target-platform=macos-x64

      - name: Create universal macOS app
        run: |
          ARM64_APP="build/macos/Build/Products/Release-arm64/nook.app"
          X64_APP="build/macos/Build/Products/Release-x64/nook.app"
          UNIVERSAL_APP="build/macos/Build/Products/Release-universal/nook.app"

          if [ ! -d "$ARM64_APP" ] || [ ! -d "$X64_APP" ]; then
            echo "Missing arch builds: arm64=$ARM64_APP x64=$X64_APP"
            exit 1
          fi

          mkdir -p "$UNIVERSAL_APP/Contents/Frameworks"

          ditto "$ARM64_APP" "$UNIVERSAL_APP"

          for fw in "$ARM64_APP/Contents/Frameworks/"*.framework; do
            NAME=$(basename "$fw")
            FW_OUT="$UNIVERSAL_APP/Contents/Frameworks/$NAME"
            rm -rf "$FW_OUT"
            mkdir -p "$FW_OUT/Versions/A"

            ARM64_FW="$ARM64_APP/Contents/Frameworks/$NAME/Versions/A/$NAME"
            X64_FW="$X64_APP/Contents/Frameworks/$NAME/Versions/A/$NAME"

            if [ -f "$ARM64_FW" ] && [ -f "$X64_FW" ]; then
              lipo -create "$ARM64_FW" "$X64_FW" -output "$FW_OUT/Versions/A/$NAME"
              ln -sf A "$FW_OUT/Versions/Current"
              cp "$FW_OUT/Versions/A/Info.plist" "$FW_OUT/Info.plist" 2>/dev/null || true
            else
              cp -R "$fw" "$FW_OUT"
            fi
          done

          for helper in "$ARM64_APP/Contents/MacOS/"nook*; do
            NAME=$(basename "$helper")
            HELPER_OUT="$UNIVERSAL_APP/Contents/MacOS/$NAME"
            ARM64_H="$ARM64_APP/Contents/MacOS/$NAME"
            X64_H="$X64_APP/Contents/MacOS/$NAME"
            if [ -f "$ARM64_H" ] && [ -f "$X64_H" ]; then
              lipo -create "$ARM64_H" "$X64_H" -output "$HELPER_OUT"
            fi
          done

          ditto -c -k --sequesterRsrc --keepParent \
            "$UNIVERSAL_APP" \
            build/macos/nook-macos-universal-v${{ env.APP_VERSION }}.zip

      - name: Upload macOS Artifact (Workflow Summary)
        uses: actions/upload-artifact@v4
        with:
          name: nook-macos
          path: build/macos/nook-macos-universal-v${{ env.APP_VERSION }}.zip
          if-no-files-found: error

  build-linux:
    needs: analyze-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build libgtk-3-dev libsecret-1-dev
      - uses: ./.github/actions/flutter-prep

      - name: Extract App Version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d '\r' | sed -E 's/\+[0-9]+$//')
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Build release Linux
        run: flutter build linux --release

      - name: Package Linux build
        run: |
          tar -czf build/nook-linux-v${{ env.APP_VERSION }}.tar.gz \
            -C build/linux/x64/release bundle

      - name: Upload Linux Artifact (Workflow Summary)
        uses: actions/upload-artifact@v4
        with:
          name: nook-linux
          path: build/nook-linux-v${{ env.APP_VERSION }}.tar.gz
          if-no-files-found: error

  release:
    needs: [build-android, build-windows, build-ios, build-macos, build-linux]
    # Android is the primary target and required for a release; the desktop and
    # iOS builds are best-effort so a flaky platform build never blocks
    # shipping the APKs. Only artifacts from successful builds are downloaded.
    if: startsWith(github.ref, 'refs/tags/') &&
        !cancelled() &&
        needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifacts
        if: needs.build-android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: nook-apks
          path: release/apks

      - name: Download Windows artifact
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: nook-windows
          path: release/windows

      - name: Download iOS artifact
        if: needs.build-ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: nook-ios
          path: release/ios

      - name: Download macOS artifact
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: nook-macos
          path: release/macos

      - name: Download Linux artifact
        if: needs.build-linux.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: nook-linux
          path: release/linux

      - name: Prepare release body from CHANGELOG
        shell: bash
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          awk -v ver="[$VERSION]" '
            /^## \[/ {
              if (index($0, "## " ver) == 1) { on = 1; print; next }
              if (on) exit
            }
            on
          ' CHANGELOG.md > release-body.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-body.md
          allowUpdates: true
          update_release_body: true
          files: |
            release/apks/**/*.apk
            release/windows/**/*.zip
            release/windows/**/*.exe
            release/ios/**/*.zip
            release/macos/**/*.zip
            release/linux/**/*.tar.gz
          name: Release ${{ github.ref_name }}

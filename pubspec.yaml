name: nook
description: "A private, local-first note-taking app. Your notes, your device, yours."
publish_to: 'none'
version: 0.7.2+1
license: GPL-3.0

# Select a SQLCipher build for the sqlite3 native-assets hook so that
# `PRAGMA key` in openEncryptedDatabase actually encrypts at rest. The default
# `sqlite3` build silently ignores the pragma and stores data in plaintext.
hooks:
  user_defines:
    sqlite3:
      source: sqlcipher

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  go_router: ^17.4.0

  # Local database
  drift: ^2.22.1
  path_provider: ^2.1.5
  path: ^1.9.0

  # Theming
  palette_generator: ^0.3.3
  google_fonts: ^6.2.1

  # Editor
  appflowy_editor: ^6.2.0
  provider: ^6.1.2

  # Doodle
  perfect_freehand: ^2.4.0

  # Media
  image_picker: ^1.1.2
  gal: ^2.3.1
  image: ^4.3.0

  # Security
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.1

  # Nearby sync
  bonsoir: ^7.1.5
  crypto: ^3.0.5
  cbor: ^6.3.4
  archive: ^3.6.1
  file_picker: ^10.3.10
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  pin_code_fields: ^8.0.1

  # Small delight, low effort
  flutter_animate: ^4.5.2
  share_plus: ^12.0.2
  flutter_staggered_animations: ^1.1.1
  flex_color_picker: ^3.6.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  lucide_flutter: ^1.28.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.14
  drift_dev: ^2.22.1
  riverpod_generator: ^4.0.4
  freezed: ^3.2.0
  json_serializable: ^6.9.0
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlayfairDisplay-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlayfairDisplay-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlayfairDisplay-ExtraBold.ttf
          weight: 800
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
  # assets:
  #   - assets/illustrations/
  #   - assets/icons/
